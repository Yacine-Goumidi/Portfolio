<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Photographe</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f14;
            color: #eaeaea;
            margin: 0;
        }

        /* ================= HEADER ================= */
        header {
            text-align: center;
            padding: 100px 20px 60px;
            border-bottom: 1px solid #222;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        header p {
            color: #aaa;
        }

        /* ================= FILTRES ================= */
        .filters {
            text-align: center;
            margin: 50px 0;
        }

        .filter-btn {
            padding: 10px 20px;
            margin: 5px;
            border-radius: 30px;
            border: 1px solid #444;
            background: transparent;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
        }

        /* ================= GALERIE MASONRY ================= */
        .gallery {
            column-count: 4;
            column-gap: 20px;
            padding: 0 40px 100px;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .gallery-item img {
            width: 100%;
            display: block;
            border-radius: 16px;
            transition: transform 0.6s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            display: flex;
            align-items: flex-end;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .overlay h3 {
            margin: 0;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        /* ================= MODAL ================= */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 16px;
        }

        .modal-close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 1200px) {
            .gallery { column-count: 3; }
        }
        @media (max-width: 900px) {
            .gallery { column-count: 2; }
        }
        @media (max-width: 600px) {
            .gallery { column-count: 1; padding: 0 20px 60px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Mon Portfolio</h1>
    <p>Sélection de mes travaux récents</p>
</header>

<!-- FILTRES -->
<div class="filters">
    <button class="filter-btn active" data-filter="all">Tout</button>
    <button class="filter-btn" data-filter="portrait">Portrait</button>
    <button class="filter-btn" data-filter="mariage">Mariage</button>
    <button class="filter-btn" data-filter="paysage">Paysage</button>
    <button class="filter-btn" data-filter="urbain">Urbain</button>
</div>

<!-- GALERIE -->
<div class="gallery">

    <div class="gallery-item" data-category="portrait">
        <img src="../../../assets/Images/project1Screenshot1.png" alt="">
        <div class="overlay"><h3>Portrait</h3></div>
    </div>

    <div class="gallery-item" data-category="mariage">
        <img src="../../../assets/Images/project1Screenshot2.png" alt="">
        <div class="overlay"><h3>Mariage</h3></div>
    </div>

    <div class="gallery-item" data-category="paysage">
        <img src="../../../assets/Images/project1Screenshot3.png" alt="">
        <div class="overlay"><h3>Paysage</h3></div>
    </div>

    <div class="gallery-item" data-category="urbain">
        <img src="../../../assets/Images/project1Screenshot4.png" alt="">
        <div class="overlay"><h3>Urbain</h3></div>
    </div>

    <!-- Duplique et change data-category pour ajouter plus d'images -->

</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <span class="modal-close" id="closeModal">&times;</span>
    <img id="modalImg">
</div>

<script>
    const filterButtons = document.querySelectorAll(".filter-btn");
    const items = document.querySelectorAll(".gallery-item");

    filterButtons.forEach(button => {
        button.addEventListener("click", () => {

            document.querySelector(".filter-btn.active").classList.remove("active");
            button.classList.add("active");

            const filter = button.getAttribute("data-filter");

            items.forEach(item => {
                if (filter === "all" || item.dataset.category === filter) {
                    item.style.display = "block";
                    setTimeout(() => item.style.opacity = "1", 10);
                } else {
                    item.style.opacity = "0";
                    setTimeout(() => item.style.display = "none", 300);
                }
            });
        });
    });

    /* Modal */
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const closeModal = document.getElementById("closeModal");

    document.querySelectorAll(".gallery-item img").forEach(img => {
        img.addEventListener("click", () => {
            modal.style.display = "flex";
            modalImg.src = img.src;
        });
    });

    closeModal.onclick = () => modal.style.display = "none";
    modal.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };
    document.addEventListener("keydown", e => { if (e.key === "Escape") modal.style.display = "none"; });
</script>

</body>
</html>
